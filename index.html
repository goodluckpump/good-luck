
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110b">
  <meta name="description" content="GOOD LUCK. Stay curious. Stay lucky. The big reveal is coming December 31, 2026.">
  <title>GOOD LUCK  — Something Is Coming</title>
  
<link rel="icon" type="image/png" href="logo-transparent-512.png">


  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background: radial-gradient(ellipse at top, #163522 0%, #07110b 55%, #030704 100%);
      color: #f4fff5;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      padding: 55px 25px;
    }

    .clover {
      font-size: 76px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 20px rgba(82, 255, 126, 0.25));
    }

    .brand {
      color: #8cff9e;
      font-size: clamp(42px, 10vw, 76px);
      font-weight: 900;
      letter-spacing: 7px;
      margin-bottom: 25px;
    }

    .headline {
      font-size: clamp(20px, 4vw, 29px);
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .description {
      max-width: 540px;
      margin: 0 auto 35px;
      color: #b9cbbd;
      font-size: 17px;
      line-height: 1.8;
    }

    .date-label {
      color: #8cff9e;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    .date {
      font-size: clamp(23px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 38px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      min-width: 175px;
      padding: 16px 22px;
      border: 1px solid #8cff9e;
      border-radius: 8px;
      background: #8cff9e;
      color: #07110b;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #b6ffc0;
      box-shadow: 0 8px 25px rgba(140, 255, 158, 0.18);
    }

    .button.secondary {
      background: transparent;
      color: #8cff9e;
    }

    .button.secondary:hover {
      background: rgba(140, 255, 158, 0.1);
    }

    .footer {
      margin-top: 42px;
      color: #6f8775;
      font-size: 11px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .container {
        padding: 35px 10px;
      }

      .brand {
        letter-spacing: 4px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
      }

      .button {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="clover">🍀</div>

    <h1 class="brand">GOOD LUCK</h1>

    <h2 class="headline">SOMETHING IS COMING.</h2>

    <p class="description">
      A new journey is about to begin.
      Stay curious. Stay connected.
      The biggest surprise is yet to come.
    </p>

    <p class="date-label">SAVE THE DATE</p>
    <p class="date">DECEMBER 31, 2026</p>

    <div class="buttons">
      <a
        class="button"
        href="https://x.com/goodluckpump"
        target="_blank"
        rel="noopener noreferrer"
      >FOLLOW ON X</a>

      <a
        class="button secondary"
        href="https://t.me/goodluckpump"
        target="_blank"
        rel="noopener noreferrer"
      >JOIN TELEGRAM</a>

      <a class="button secondary" href="launch.html">
        DISCOVER THE SURPRISE 🍀
      </a>
    </div>

    <footer class="footer">
      GOOD LUCK © 2026<br>
      STAY CURIOUS. STAY LUCKY.
    </footer>
  </main>
</body>
</html>
