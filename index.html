
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071109">
  <meta name="description" content="GOOD LUCK. Something special is coming. Stay curious. Stay lucky.">
  <title>GOOD LUCK 🍀 — Something Is Coming</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top, #173b20 0%, #071109 55%, #020503 100%);
      color: #f4fff2;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 18px;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      padding: 55px 15px;
    }

    .clover {
      font-size: 76px;
      margin-bottom: 18px;
      filter: drop-shadow(0 0 22px rgba(80, 255, 100, 0.3));
    }

    h1 {
      color: #8cff8c;
      font-size: clamp(58px, 12vw, 112px);
      font-weight: 900;
      letter-spacing: clamp(2px, 1vw, 8px);
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 0 35px rgba(80, 255, 100, 0.22);
      overflow-wrap: anywhere;
      margin-bottom: 25px;
    }

    .headline {
      font-size: clamp(18px, 3vw, 27px);
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 22px;
    }

    .description {
      color: #c5d8c6;
      font-size: 18px;
      line-height: 1.8;
      max-width: 620px;
      margin: 0 auto 30px;
    }

    .tagline {
      color: #8cff8c;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 35px;
    }

    .date {
      display: inline-block;
      border: 1px solid #397a43;
      border-radius: 12px;
      padding: 16px 25px;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 32px;
      background: rgba(15, 45, 20, 0.55);
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      min-width: 150px;
      padding: 15px 24px;
      border-radius: 9px;
      background: #8cff8c;
      color: #071109;
      text-decoration: none;
      font-weight: 800;
      transition: transform 0.2s, background 0.2s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #b4ffb4;
    }

    .button.secondary {
      background: transparent;
      border: 1px solid #8cff8c;
      color: #8cff8c;
    }

    footer {
      color: #809181;
      font-size: 12px;
      line-height: 1.8;
      margin-top: 25px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 35px 5px;
      }

      .clover {
        font-size: 60px;
      }

      .description {
        font-size: 16px;
      }

      .tagline {
        letter-spacing: 2px;
      }

      .date {
        font-size: 15px;
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="clover">🍀</div>

    <h1>GOOD LUCK</h1>

    <p class="headline">SOMETHING IS COMING.</p>

    <p class="description">
      A new journey begins soon.<br>
      A mystery is waiting to be revealed.<br>
      Are you ready?
    </p>

    <p class="tagline">STAY CURIOUS. STAY LUCKY.</p>

    <div class="date">DECEMBER 31, 2026</div>

    <div class="buttons">
      <a class="button" href="https://x.com/" target="_blank" rel="noopener noreferrer">
        FOLLOW ON X
      </a>

      <a class="button secondary" href="https://t.me/" target="_blank" rel="noopener noreferrer">
        JOIN TELEGRAM
      </a>
    </div>

    <footer>
      GOOD LUCK · A mystery will be revealed.<br>
      <br>
      © 2026 GOOD LUCK
    </footer>
  </main>
</body>
</html>
